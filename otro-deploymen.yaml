apiVersion: apps/v1
kind: Deployment
metadata:
  name: estudiante
  labels:
    app: estudiante
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estudiante
  template:
    metadata:
      labels:
        app: estudiante
    spec:
      containers:
      - name: estudiante
        image: danielsabana/cualquiercosa:8.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 500Mi