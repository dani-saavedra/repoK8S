apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaca
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /lavacadelprofe(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: vaca
            port:
              number: 80

