apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaca
  labels:
    app: vaca
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaca
  template:
    metadata:
      labels:
        app: vaca
    spec:
      containers:
      - name: vaca
        image: danielsabana/vaca:1.4.0
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
        startupProbe:
          httpGet:
            path: /vaca
            port: 8080
          initialDelaySeconds: 15

            #Jmeter / xyz
        
